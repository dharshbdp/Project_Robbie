[project]
name = "project-robbie"
version = "0.2.0"
description = "Project Robbie: A personal AI character built from the ground up"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "dharshbdp" }
]
dependencies = [
    "torch",
    "numpy>=1.26.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robbie"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

